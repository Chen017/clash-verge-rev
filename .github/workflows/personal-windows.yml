name: Personal Windows amd64
on:
  schedule:
    - cron: '43 */6 * * *'
  workflow_dispatch:
  push:
    branches: [codex/personal-builds]
    paths: ['.personal/**', '!.personal/*.md', '.github/workflows/personal-windows.yml']
  pull_request:
    branches: [codex/personal-builds]
    paths: ['.personal/**', '.github/workflows/personal-windows.yml']
permissions:
  contents: read
jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: python3 -B -m unittest discover -s .personal -p 'test_*.py' -v
      - run: node --check .personal/core.mjs
  release:
    if: github.event_name != 'pull_request' && github.repository == 'Chen017/clash-verge-rev' && github.ref == 'refs/heads/codex/personal-builds'
    permissions:
      contents: write
    concurrency:
      group: personal-windows-release
      cancel-in-progress: false
    runs-on: windows-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      HUSKY: '0'
      CARGO_INCREMENTAL: '0'
      PYTHONUTF8: '1'
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Prepare stable upstream and pinned personal core
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -B -m unittest discover -s .personal -p 'test_*.py' -v
          python .personal/release.py prepare
      - uses: actions/setup-node@v7.1.0
        if: steps.prepare.outputs.needed == 'true'
        with:
          node-version: ${{ steps.prepare.outputs.node }}
      - uses: pnpm/action-setup@v6
        if: steps.prepare.outputs.needed == 'true'
        with:
          package_json_file: .personal/work/source/package.json
          cache: true
          cache_dependency_path: .personal/work/source/pnpm-lock.yaml
          run_install: false
      - uses: dtolnay/rust-toolchain@stable
        if: steps.prepare.outputs.needed == 'true'
        with:
          toolchain: ${{ steps.prepare.outputs.rust }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        if: steps.prepare.outputs.needed == 'true'
        with:
          workspaces: .personal/work/source -> target
          cache-on-failure: true
      - name: Stage checksum-verified core and upstream service resources
        if: steps.prepare.outputs.needed == 'true'
        working-directory: .personal/work/source
        run: |
          pnpm install --frozen-lockfile
          pnpm prebuild x86_64-pc-windows-msvc
          rustfmt --edition 2024 src-tauri/src/core/updater.rs src-tauri/src/feat/core_upgrade.rs
      - name: Build one signed Windows amd64 NSIS installer
        if: steps.prepare.outputs.needed == 'true'
        working-directory: .personal/work/source
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/.personal/work/source/target
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          pnpm exec tauri build --target x86_64-pc-windows-msvc --bundles nsis
      - name: Check update ordering and core archive integrity
        if: steps.prepare.outputs.needed == 'true'
        working-directory: .personal/work/source
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/.personal/work/source/target
        run: |
          cargo test --release --features clippy --target x86_64-pc-windows-msvc -p clash-verge --lib personal_update_tests
          cargo test --release --features clippy --target x86_64-pc-windows-msvc -p clash-verge --lib feat::core_upgrade::tests
      - name: Verify and package the signed installer
        if: steps.prepare.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .personal/release.py package
      - name: Publish the complete release
        if: steps.prepare.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git --hostname github.com
          python .personal/release.py publish
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: windows-failure-evidence
          path: |
            .personal/work/plan.json
            .personal/work/source/target/x86_64-pc-windows-msvc/release/bundle/nsis/*
          include-hidden-files: true
          retention-days: 7
